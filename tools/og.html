<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Geist;src:url(../assets/fonts/geist-500.woff2);font-weight:500}
@font-face{font-family:Geist;src:url(../assets/fonts/geist-800.woff2);font-weight:800}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#111113;color:#fff;font-family:Geist,sans-serif;position:relative}
.glow{position:absolute;right:-80px;top:-60px;width:700px;height:700px;background:radial-gradient(circle,rgba(227,189,98,.20),transparent 62%)}
.copy{position:absolute;left:80px;top:78px;width:620px}
.brand{display:flex;align-items:center;gap:16px;font-weight:800;font-size:36px;letter-spacing:-.03em}
.brand img{width:52px;height:58px}
h1{font-size:66px;line-height:1.04;letter-spacing:-.035em;font-weight:800;margin:56px 0 28px}
h1 span{color:#E3BD62}
.pill{display:inline-block;padding:14px 26px;border-radius:999px;background:linear-gradient(100deg,#B07D22,#E3BD62 60%,#C4912F);color:#111113;font-weight:800;font-size:24px;letter-spacing:-.01em}
.sub{color:#A9A398;font-size:24px;font-weight:500;margin-top:22px}
.phone{position:absolute;left:770px;top:70px;width:340px;padding:9px;border-radius:52px;background:#0A0A0B;box-shadow:0 0 0 1.5px rgba(255,255,255,.12) inset,0 40px 80px -20px rgba(0,0,0,.8)}
.phone img{display:block;width:100%;border-radius:43px}
</style></head><body>
<div class="glow"></div>
<div class="copy">
  <div class="brand"><img src="../assets/logo-ondark-96.png">BarberApp</div>
  <h1>Komisi kapster kehitung sendiri. <span>Selisih laci langsung ketahuan.</span></h1>
  <span class="pill">Coba gratis 14 hari</span>
  <div class="sub">Aplikasi kasir + pembukuan khusus barbershop</div>
</div>
<div class="phone"><img src="../assets/ss-kasir.webp"></div>
</body></html>
