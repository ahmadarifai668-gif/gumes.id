<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF viewer mock</title>
<style>
  @font-face { font-family: Geist; src: url(../../assets/fonts/geist-500.woff2); font-weight: 500; }
  @font-face { font-family: Geist; src: url(../../assets/fonts/geist-600.woff2); font-weight: 600; }
  html, body { margin: 0; height: 100%; }
  body { font-family: Geist, system-ui, sans-serif; background: #4A4D52; display: flex; flex-direction: column; overflow: hidden; }
  .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; height: 52px; padding: 0 14px; background: #2B2D31; color: #fff; }
  .bar svg { width: 20px; height: 20px; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; opacity: .9; }
  .badge { font-size: 10px; font-weight: 600; letter-spacing: .06em; background: #C8433A; color: #fff; padding: 3px 6px; border-radius: 4px; }
  .name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .pages { font-size: 13px; color: #C9CBD0; white-space: nowrap; }
  .zoom { display: none; font-size: 13px; color: #C9CBD0; padding: 4px 10px; border: 1px solid rgba(255,255,255,.18); border-radius: 6px; }
  .stage { flex: 1; overflow: hidden; display: flex; justify-content: center; padding: 16px 10px; }
  .page { width: 100%; max-width: 640px; align-self: flex-start; box-shadow: 0 4px 18px rgba(0,0,0,.45); background: #fff; }
  .page img { display: block; width: 100%; }
  @media (min-width: 700px) { .stage { padding: 24px; } .page { max-width: 760px; } .zoom { display: inline-block; } }
  @media (min-width: 1200px) { .bar { height: 56px; padding: 0 20px; } .stage { padding: 28px; } .page { max-width: 620px; } }
</style></head>
<body>
  <div class="bar">
    <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    <span class="badge">PDF</span>
    <span class="name">Laba-Rugi-2026-11-01-2026-11-24.pdf</span>
    <span class="zoom">100%</span>
    <span class="pages">1 / 1</span>
    <svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    <svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"/></svg>
  </div>
  <div class="stage"><div class="page"><img src="pdf-page.png" alt=""></div></div>
</body></html>
